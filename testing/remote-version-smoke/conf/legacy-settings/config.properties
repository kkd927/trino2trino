# Single-node smoke-test coordinator.
coordinator=true
node-scheduler.include-coordinator=true
http-server.http.port=8080
discovery.uri=http://localhost:8080
catalog.management=${ENV:CATALOG_MANAGEMENT}

# Load only the connector plugins required by this smoke test.
plugin.dir=/tmp/trino-smoke-plugins

# A remote server of the local version with these settings evaluates decimal arithmetic,
# regular expressions, and casts from char to varchar as an earlier release does. The
# connector must send it only the basic list.
deprecated.legacy-arithmetic-decimal-operators=true
deprecated.regex-library=RE2J
deprecated.legacy-varchar-to-char-coercion=true
