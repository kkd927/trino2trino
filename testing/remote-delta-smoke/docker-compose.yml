services:
  s3mock:
    image: adobe/s3mock:5.2.2
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: remote-delta-smoke
    ports:
      - "19000:9090"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/favicon.ico"]
      interval: 5s
      timeout: 5s
      retries: 12

  hive-metastore:
    build:
      context: ./hive-metastore
    image: trino2trino-remote-delta-smoke-hive:4.0.1
    depends_on:
      s3mock:
        condition: service_healthy
    environment:
      SERVICE_NAME: metastore
      DB_DRIVER: derby
      HIVE_CUSTOM_CONF_DIR: /remote-delta-smoke/hive-conf
      HADOOP_CLASSPATH: /opt/hadoop/share/hadoop/tools/lib/*
      SERVICE_OPTS: >-
        -Dhive.metastore.warehouse.dir=file:///tmp/hive/warehouse
        -Dfs.s3.impl=org.apache.hadoop.fs.s3a.S3AFileSystem
        -Dfs.s3a.impl=org.apache.hadoop.fs.s3a.S3AFileSystem
        -Dfs.s3a.endpoint=http://s3mock:9090
        -Dfs.s3a.access.key=test
        -Dfs.s3a.secret.key=test
        -Dfs.s3a.path.style.access=true
        -Dfs.s3a.connection.ssl.enabled=false
    volumes:
      - ./conf/hive:/remote-delta-smoke/hive-conf:ro
    ports:
      - "19083:9083"

  trino-remote-delta:
    image: trinodb/trino:482
    depends_on:
      hive-metastore:
        condition: service_started
      s3mock:
        condition: service_healthy
    volumes:
      - ./conf/remote/catalog:/etc/trino/catalog:ro
      - ./sql:/remote-delta-smoke/sql:ro
    ports:
      - "19080:8080"

  trino-local-delta:
    image: trinodb/trino:482
    depends_on:
      - trino-remote-delta
    volumes:
      - ../../target/trino-trino-482:/usr/lib/trino/plugin/trino:ro
      - ./conf/local/catalog:/etc/trino/catalog:ro
      - ./sql:/remote-delta-smoke/sql:ro
    ports:
      - "18080:8080"
